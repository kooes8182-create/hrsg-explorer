# HRSG Explorer — Render 배포 설정 (Blueprint). 무료 플랜: 웹 서비스 1개 + PostgreSQL 1개.
# 서버 하나(Django)가 API(/api/...)와 화면(React 빌드 결과)을 같은 주소로 제공합니다.
# 절차: explorer/docs/07_render_deploy.md
# AI 근거 검색은 배포판에서 쓰지 않으므로 ANTHROPIC_API_KEY 는 넣지 않습니다.
services:
  - type: web
    name: hrsg-explorer
    runtime: python
    plan: free
    region: singapore
    # 1) 파이썬 패키지 설치  2) 화면 빌드 (휴대폰 화면 켬)
    buildCommand: >-
      pip install -r explorer/backend/requirements-render.txt &&
      cd explorer/frontend && npm ci && VITE_MOBILE_UI=1 npm run build
    # 무료 플랜은 Shell 이 없어서, 서버 시작 때 DB 준비·데모 케이스·데모 계정을 함께 처리합니다 (여러 번 실행해도 중복 없음)
    # 외부 AI(Claude) 전송 허용은 화면에서 막혀 있어(권한표), 환경 변수 AI_EXTERNAL=on 일 때만 켭니다. 그 밖의 값·없음 = 끔
    startCommand: >-
      cd explorer/backend &&
      python manage.py migrate --noinput &&
      python manage.py seed_demo_cases &&
      python manage.py create_demo_accounts --from-env &&
      python manage.py ai_settings --external "$( [ "$AI_EXTERNAL" = on ] && echo on || echo off )" &&
      gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 1 --timeout 120
    healthCheckPath: /api/health/
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.4
      - key: NODE_VERSION
        value: 20.18.0
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: hrsg-explorer-db
          property: connectionString
      # 아래 값은 Render 화면에서 직접 입력합니다 (이 파일·Git 에 넣지 않음)
      - key: DEMO_ENGINEER_PASSWORD
        sync: false
      - key: DEMO_ADMIN_PASSWORD
        sync: false

databases:
  - name: hrsg-explorer-db
    databaseName: hrsg_explorer
    plan: free
    region: singapore
