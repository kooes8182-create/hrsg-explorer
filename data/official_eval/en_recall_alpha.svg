   <text style="font-size: 7.5px; font-family: 'AppleGothic'; fill: #6b6b6b" transform="translate(6.12 361.536)">점 = 실제 평가한 비중(0%, 10%, … 100%). 점 사이 선은 연결일 뿐 측정값이 아님. 후보 BM25 50 · 벡터 50, RRF k = 60, 상위 8개·참고문헌당 2개.</text>
