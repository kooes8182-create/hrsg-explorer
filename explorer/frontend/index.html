<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#FFFFFF" />
    <title>HRSG Explorer</title>
    <!-- Pretendard (숫자·한글·영문 가독성). 받지 못하면 시스템 글꼴로 대체 -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
    <script>
      // 첫 화면 깜빡임 방지: 저장된 테마를 React 실행 전에 적용 (저장소를 못 읽으면 시스템 설정)
      try {
        var p = JSON.parse(localStorage.getItem('hrsgx.prefs') || '{}')
        var dark = p.theme ? p.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches
        document.documentElement.classList.toggle('dark', dark)
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
